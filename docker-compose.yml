services:

  safechatai-api:
    build: .
    container_name: safechatai-api

    ports:
      - "8000:8000"

    env_file:
      - .env.production

    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  safechatai-frontend:
    build:
      context: ./frontend

    container_name: safechatai-frontend

    ports:
      - "3000:80"

    depends_on:
      - safechatai-api

    restart: always

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3